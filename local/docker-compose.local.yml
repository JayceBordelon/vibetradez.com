name: vibetradez-local

# Local development stack for VibeTradez.
#
# Spins up Postgres (two databases: vibetradez + auth), the Go trading
# API server (which now handles Google OAuth in-process), and the
# Next.js frontend. No Traefik — services talk directly over the Docker
# network.
#
# Usage:
#   cd vibetradez.com/local
#   docker compose -f docker-compose.local.yml up --build
#
# Then visit:
#   http://localhost:3001         — Next.js frontend
#   http://localhost:8080/health  — trading server health
#
# Sign-in (optional): set GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET in
# your shell before `up`, and register http://localhost:8080/auth/google/callback
# in Google Cloud Console under the same OAuth client. Stub values
# boot the server but the OAuth flow will fail at Google's consent
# screen (redirect_uri_mismatch).
#
# Tear down (and clear seeded data):
#   docker compose -f docker-compose.local.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: vt-local-postgres
    environment:
      POSTGRES_USER: vibetradez
      POSTGRES_PASSWORD: vibetradez
      POSTGRES_DB: vibetradez
    ports:
      - "5433:5432"
    volumes:
      - vt_local_pgdata:/var/lib/postgresql/data
      # Init scripts run in lexical order on first boot only. Creates
      # the second database (`auth`) that holds users + sessions, then
      # seeds the main `vibetradez` database with sample trade history.
      - ./init-auth-db.sql:/docker-entrypoint-initdb.d/00-init-auth-db.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibetradez -d vibetradez"]
      interval: 3s
      timeout: 3s
      retries: 10

  trading-server:
    container_name: vt-local-server
    build:
      context: ../server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://vibetradez:vibetradez@postgres:5432/vibetradez?sslmode=disable
      # Dedicated pool for the in-process Google OAuth tables
      # (users + sessions + oauth_states).
      AUTH_DATABASE_URL: postgresql://vibetradez:vibetradez@postgres:5432/auth?sslmode=disable
      # Stub keys; server requires them to start but the local stack
      # never calls real APIs. Sign-in flow against Google will
      # redirect_uri_mismatch unless the operator provides real keys
      # and registers http://localhost:8080/auth/google/callback in
      # Google Cloud Console.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-stub-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-stub-google-client-secret}
      GOOGLE_CALLBACK_URL: http://localhost:8080/auth/google/callback
      RESEND_API_KEY: re_local_stub
      ANTHROPIC_API_KEY: sk-local-stub
      ANTHROPIC_MODEL: claude-fable-5
      EMAIL_FROM: "Local Dev <local@vibetradez.local>"
      EMAIL_RECIPIENTS: ""
      # Stub HMAC key for unsubscribe tokens. Real value MUST be
      # operator-generated via `openssl rand -base64 32`; this is
      # just a static stub for the local Docker stack so the server
      # boots without operator setup. Tokens minted here are NOT
      # valid against the production server (different key).
      UNSUBSCRIBE_HMAC_KEY: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
      RUN_ON_START: "false"
      # This account trades live (the only mode), but live trading needs a
      # configured Schwab client, which the local stack does not have. So the
      # broker stays unwired here and the dashboard reads the seeded
      # portfolio_* tables (moves, stance, equity-vs-SPY curve, last book).
      # TRADING_ENABLED can stay true: with no Schwab client the manager
      # simply does not arm, and the crons are parked on Sunday (below) too.
      TRADING_ENABLED: "true"
      OPERATOR_EMAIL: local@vibetradez.local
      # Push the portfolio crons to Sunday so a session never fires during
      # local dev (no real broker / model to call).
      CRON_SCHEDULE_PORTFOLIO: "0 9 * * 0"
      CRON_SCHEDULE_RISK: "0 10 * * 0"
      CRON_SCHEDULE_EOD_SNAPSHOT: "0 16 * * 0"
      SESSION_COOKIE_NAME: vt_session
      SESSION_TTL_DAYS: "30"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  trading-frontend:
    container_name: vt-local-frontend
    build:
      context: ../client
      dockerfile: Dockerfile
    environment:
      # Server-side fetches (Server Components) hit the Go server via the Docker network.
      API_URL: http://trading-server:8080
      # Client-side fetches go through the browser at /api/* — but in local dev with no
      # reverse proxy, the browser hits the Next.js host directly. To make /api/* work
      # without Traefik, the frontend rewrites /api/* and /auth/* and /admin/* and /health
      # to the Go server. See next.config.local.ts in this directory.
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3001:3001"
    depends_on:
      - trading-server
    restart: unless-stopped

volumes:
  vt_local_pgdata:
