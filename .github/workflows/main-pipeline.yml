name: CI/CD Pipeline

# Auto-fires on every push to main and on manual dispatch. Deploys
# both vibetradez services (trading-server + trading-frontend) via
# SSH to the droplet. Compose lives in this repo at the root and
# owns Traefik + its own network; all docker commands run from
# REPO_DIR.
#
# Market-hours guard runs in `defer` mode: it skips the downstream jobs
# only when a deploy would land within +/-5 min of a Claude trading
# session (open 9:45, midday 12:30, pre-close 15:30 ET, Mon-Fri) -- the
# model runs that place live orders, which a force-recreate would kill
# mid-flight. Merges that land between sessions deploy immediately. The
# 16:35 ET post-market replay (post-market-deploy.yml) dispatches this
# workflow again with override_market_hours_guard=true so a push deferred
# inside a session window still goes out post-close. Use the override
# input for emergency deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      override_market_hours_guard:
        type: boolean
        default: false
        description: Skip the market-hours block (emergency deploys only).
  # Callable by post-market-deploy.yml (the 16:35 ET replay) so a push merged
  # during the market-hours window still ships post-close. The input mirrors
  # the workflow_dispatch one; both are read via `inputs.` in
  # market_hours_guard, so a caller passing true overrides the guard.
  workflow_call:
    inputs:
      override_market_hours_guard:
        type: boolean
        default: false

concurrency:
  group: deploy-vibetradez
  cancel-in-progress: false

env:
  REPO_DIR: /home/jayce/vibetradez.com

jobs:
  market_hours_guard:
    name: Market hours guard
    runs-on: ubuntu-latest
    outputs:
      in_window: ${{ steps.check.outputs.in_window }}
    steps:
      - id: check
        run: |
          if [ "${{ inputs.override_market_hours_guard }}" = "true" ]; then
            echo "in_window=false (override set)"
            echo "in_window=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Defer a deploy ONLY when it would land within +/-5 min of a
          # Claude trading session. The session crons run inside the
          # trading-server container, and the deploy force-recreates that
          # container; shutdown only calls cron.Stop() (no in-flight drain),
          # so a recreate mid-session SIGKILLs the run. Blocking just these
          # narrow windows (instead of all of 09:00-16:30 ET) lets a merge
          # land in the GAPS between sessions and ship immediately, while a
          # merge inside a window is still deferred to the 16:35 ET replay.
          # America/New_York handles DST automatically.
          #
          # Session START times (ET), from the cmd/scanner cron defaults
          # (CRON_SCHEDULE_PORTFOLIO_{OPEN,MIDDAY,CLOSE}):
          #   open 9:45 (585)   midday 12:30 (750)   pre-close 15:30 (930)
          # These three are the model runs that place live orders. The
          # every-15-min risk sweep and the 16:00 EOD snapshot are NOT model
          # runs (idempotent reconcile / deterministic snapshot) and are not
          # guarded. Keep the minute marks below in sync if the cron times
          # ever change.
          DOW=$(TZ=America/New_York date +'%u')
          if [ "$DOW" -lt 1 ] || [ "$DOW" -gt 5 ]; then
            echo "Proceeding: weekend (DOW $DOW), no Claude sessions today"
            echo "in_window=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          HHMM=$(TZ=America/New_York date +'%H:%M')
          NOW=$(( 10#${HHMM%%:*} * 60 + 10#${HHMM##*:} ))
          BUF=5
          in_window=false
          for s in 585 750 930; do
            if [ "$NOW" -ge $(( s - BUF )) ] && [ "$NOW" -le $(( s + BUF )) ]; then
              in_window=true
              break
            fi
          done
          if [ "$in_window" = "true" ]; then
            echo "Deferring: $HHMM ET is within +/-${BUF}min of a Claude session"
            echo "in_window=true" >> $GITHUB_OUTPUT
          else
            echo "Proceeding: $HHMM ET is between Claude sessions"
            echo "in_window=false" >> $GITHUB_OUTPUT
          fi

  sync:
    name: Sync
    needs: market_hours_guard
    if: needs.market_hours_guard.outputs.in_window != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest on droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ env.REPO_DIR }}
            git pull --ff-only origin main

  build:
    name: Build
    needs: sync
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: docker compose build (server + frontend)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Single build invocation does both images in one pass, so
          # the runner doesn't pay the SSH + docker-buildx startup
          # cost twice. --no-cache ensures fresh Go/Node layers when
          # the lockfiles change underneath an unchanged Dockerfile.
          script: |
            set -e
            cd ${{ env.REPO_DIR }}
            docker compose build --no-cache trading-server trading-frontend

  deploy:
    name: Deploy
    needs: build
    if: success()
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:
      - name: Deploy trading-server (force-recreate, wait for healthy)
        id: deploy_server
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Order matters: trading-server force-recreated FIRST so
          # the running container picks up the new compose yaml
          # (healthcheck block, env). trading-frontend's depends_on
          # then sees a healthcheck-equipped trading-server and the
          # rollout can scale safely. Reversing the order leaves
          # trading-frontend asking compose to wait on a healthcheck
          # the running trading-server container doesn't have, and
          # compose refuses with "dependency failed to start".
          #
          # --wait blocks until the trading-server's compose
          # healthcheck (/healthz, db-only — intentionally lightweight
          # so Schwab or Anthropic outages don't trigger restart
          # cascades) returns healthy. --wait-timeout 180s gives a
          # roomy ceiling for boot; anything slower is a real boot
          # problem worth failing on.
          script: |
            set -e
            cd ${{ env.REPO_DIR }}
            docker compose up -d --wait --wait-timeout 180 --force-recreate trading-server

      - name: Deploy trading-frontend (rolling)
        id: deploy_frontend
        continue-on-error: true
        if: steps.deploy_server.outcome == 'success'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Rolling so dashboard visitors mid-session don't see a
          # white-flash. --wait-after-healthy 30 drains in-flight
          # SSE/HTTP requests before terminating the old container.
          script: |
            set -e
            cd ${{ env.REPO_DIR }}
            docker rollout trading-frontend --timeout 120 --wait-after-healthy 30

      - name: Ensure Traefik is up
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ env.REPO_DIR }}
            docker compose up -d traefik

      - name: Compute status
        id: status
        if: always()
        run: |
          SERVER="${{ steps.deploy_server.outcome }}"
          FRONTEND="${{ steps.deploy_frontend.outcome }}"
          if [ "$SERVER" = "success" ] && [ "$FRONTEND" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "::error::server=$SERVER frontend=$FRONTEND"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

  healthcheck:
    name: Health Check
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Verify endpoints
        run: |
          set -e
          # Allow ~30s for both containers + Traefik to settle.
          sleep 30
          # /health returns a JSON payload with per-service status.
          # We accept 200 (everything ok) OR 503 (a downstream like
          # Schwab is temporarily flaky) since the deploy can succeed
          # even when an upstream is briefly degraded; what we're
          # gating on is that the trading-server is serving HTTP at
          # all, not that every downstream is hot.
          code=$(curl -sSL -o /tmp/health.json -w '%{http_code}' https://vibetradez.com/health)
          cat /tmp/health.json
          echo ""
          if [ "$code" != "200" ] && [ "$code" != "503" ]; then
            echo "::error::vibetradez.com/health returned $code"
            exit 1
          fi
          # Dashboard SSR check
          code=$(curl -sSL -o /dev/null -w '%{http_code}' https://vibetradez.com/)
          if [ "$code" != "200" ]; then
            echo "::error::vibetradez.com/ returned $code"
            exit 1
          fi
          echo "vibetradez.com/: 200, /health: $code"

  cleanup:
    name: Cleanup
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: docker image prune
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker image prune -af --filter "until=24h"

  summary:
    name: Summary
    # if: always() so the summary panel exists on every run — green
    # deploy, failed deploy, deferred-by-market-hours, override fire,
    # all show up with a stage-by-stage breakdown. The summary lands
    # in $GITHUB_STEP_SUMMARY which is the panel GitHub renders at
    # the top of the run page.
    needs: [market_hours_guard, sync, build, deploy, healthcheck, cleanup]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write run summary
        env:
          MARKET_GUARD: ${{ needs.market_hours_guard.result }}
          IN_WINDOW: ${{ needs.market_hours_guard.outputs.in_window }}
          SYNC: ${{ needs.sync.result }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          DEPLOY_STATUS: ${{ needs.deploy.outputs.status }}
          HEALTHCHECK: ${{ needs.healthcheck.result }}
          CLEANUP: ${{ needs.cleanup.result }}
          OVERRIDE: ${{ inputs.override_market_hours_guard }}
          TRIGGER: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          short_sha="${SHA:0:7}"
          subject="${COMMIT_MSG%%$'\n'*}"

          # badge() collapses a job result string into a short token. Keeps
          # the table column narrow and skips emoji per repo convention.
          badge() {
            case "$1" in
              success)   echo "ok" ;;
              failure)   echo "FAIL" ;;
              cancelled) echo "cancelled" ;;
              skipped)   echo "skipped" ;;
              "")        echo "—" ;;
              *)         echo "$1" ;;
            esac
          }

          {
            echo "# CI/CD pipeline summary"
            echo ""
            echo "**Trigger:** \`$TRIGGER\` by \`$ACTOR\` on \`$REF\` @ \`$short_sha\`"
            if [ "$TRIGGER" = "workflow_dispatch" ]; then
              echo "**Override market guard:** \`${OVERRIDE:-false}\`"
            elif [ -n "$subject" ]; then
              echo "**Commit:** $subject"
            fi
            echo "**Run:** $RUN_URL"
            echo ""
            echo "| Stage | Result | Notes |"
            echo "|---|---|---|"
            if [ "$IN_WINDOW" = "true" ]; then
              guard_note="deferred (within +/-5 min of a Claude session)"
            else
              guard_note="proceeded"
            fi
            echo "| Market hours guard | $(badge "$MARKET_GUARD") | $guard_note |"
            echo "| Sync | $(badge "$SYNC") | git pull on droplet |"
            echo "| Build | $(badge "$BUILD") | docker compose build trading-server + trading-frontend |"
            deploy_note="server force-recreate, frontend rolling"
            if [ -n "$DEPLOY_STATUS" ]; then
              deploy_note="$deploy_note (status=$DEPLOY_STATUS)"
            fi
            echo "| Deploy | $(badge "$DEPLOY") | $deploy_note |"
            echo "| Health check | $(badge "$HEALTHCHECK") | / and /health probes |"
            echo "| Cleanup | $(badge "$CLEANUP") | docker image prune |"
            echo ""
            if [ "$IN_WINDOW" = "true" ]; then
              echo "> Within +/-5 min of a Claude trading session. Downstream jobs deliberately skipped so a force-recreate can't kill an in-flight model run. The 16:35 ET post-market replay (\`post-market-deploy.yml\`) re-fires this workflow with the override input set so the deferred push goes out post-close."
            fi
            if [ "$DEPLOY" = "failure" ] || [ "$BUILD" = "failure" ] || [ "$SYNC" = "failure" ] || [ "$HEALTHCHECK" = "failure" ]; then
              echo ""
              echo "> **One or more stages failed.** Open the failing job above for the full droplet SSH output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
