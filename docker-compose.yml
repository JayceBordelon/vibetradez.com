# vibetradez.com self-contained stack. Owns its own Traefik, its own
# letsencrypt cert volume, and its own bridge network. Drop-in
# deployable on any droplet that has docker + ports 80/443 open.
#
# Three services:
#   - traefik: TLS termination + Host()/PathPrefix() routing
#   - trading-server: Go API + cron + in-process Google OAuth
#     (serves /auth/google/start + /auth/google/callback in-binary)
#   - trading-frontend: Next.js dashboard. depends_on the server's
#     /healthz so cold-boot doesn't briefly serve connection-refused
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  traefik:
    image: traefik:v2.10
    container_name: vibetradez-traefik
    logging: *default-logging
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=bordelonjayce@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "vibetradez_letsencrypt:/letsencrypt"
    networks:
      - vibetradez-network
    restart: unless-stopped

  trading-server:
    image: vibetradez.com-trading-server:latest
    build:
      context: ./server
    env_file:
      - ./server/.env
    expose:
      - "8080"
    networks:
      - vibetradez-network
    restart: unless-stopped
    logging: *default-logging
    # /healthz is the lightweight liveness probe (db ping + listener
    # only, no upstream probes). The richer /health endpoint exercised
    # by the post-deploy healthcheck workflow runs Schwab + Anthropic
    # + sentiment probes that can take 5-25s on a slow upstream, so
    # tying the compose healthcheck to /health would trip the first
    # time Anthropic returned slowly.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "app=trading-server"
      - "traefik.enable=true"
      # API + auth + health routes — higher priority than the
      # catch-all frontend router. /auth/google/* lands here.
      - "traefik.http.routers.trading-api.rule=(Host(`vibetradez.com`) || Host(`www.vibetradez.com`) || Host(`jaycetrades.com`) || Host(`www.jaycetrades.com`)) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || Path(`/health`))"
      - "traefik.http.routers.trading-api.entrypoints=websecure"
      - "traefik.http.routers.trading-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.trading-api.priority=20"
      - "traefik.http.services.trading-api.loadbalancer.server.port=8080"

  trading-frontend:
    image: vibetradez.com-trading-frontend:latest
    build:
      context: ./client
    environment:
      - API_URL=http://trading-server:8080
    expose:
      - "3001"
    networks:
      - vibetradez-network
    restart: unless-stopped
    logging: *default-logging
    # condition: service_healthy waits for trading-server's /healthz to
    # return 200 before starting trading-frontend. Cold boot of the
    # full stack would otherwise leave Next.js SSR-fetching
    # /api/market/status + /api/quotes/stream against a connection-
    # refused upstream and serving an error shell for the first 10-30s.
    depends_on:
      trading-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "app=trading-frontend"
      - "traefik.enable=true"
      # Catch-all frontend — lower priority than trading-api so
      # /api/* and /auth/* don't route here.
      - "traefik.http.routers.trading-frontend.rule=Host(`vibetradez.com`) || Host(`www.vibetradez.com`) || Host(`jaycetrades.com`) || Host(`www.jaycetrades.com`)"
      - "traefik.http.routers.trading-frontend.entrypoints=websecure"
      - "traefik.http.routers.trading-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.trading-frontend.priority=10"
      - "traefik.http.services.trading-frontend.loadbalancer.server.port=3001"

volumes:
  vibetradez_letsencrypt:

networks:
  vibetradez-network:
    driver: bridge
